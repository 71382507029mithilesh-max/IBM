---
# ==========================================================
# StayEase - Master Server Automation Playbook
# Provisions servers, installs Docker, deploys app & monitors
# ==========================================================

# Phase 1: Base system setup & Docker engine
- name: Configure Base Systems & Container Runtime
  hosts: all
  become: yes
  roles:
    - common
    - docker

# Phase 2: Application Deploy on Compute Nodes
- name: Deploy StayEase Application Microservices
  hosts: app_servers
  become: yes
  roles:
    - app_deploy
    - monitoring

# Phase 3: Prometheus & Grafana Configuration
- name: Configure Central Observability Node
  hosts: monitoring_servers
  become: yes
  tasks:
    - name: Start Prometheus and Grafana containers
      command: docker compose -f /opt/stayease/docker-compose.yml up -d prometheus grafana
      failed_when: false
