global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. StayEase Hotel Booking Flask Application Scraper
  - job_name: "hotel-booking-api"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:5000"]
        labels:
          environment: "production"
          service: "hotel-booking-api"
          tier: "backend"

  # 3. Host / Node Exporter (Infrastructure metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          environment: "production"
          tier: "compute"
